overlay: 1.1.0
info:
  title: GitHub code search runtime semantics
  version: 1.0.0
actions:
  - target: "$['components']"
    update:
      securitySchemes:
        githubBearer:
          type: http
          scheme: bearer
  - target: "$['paths']['/search/code']['get']"
    update:
      security:
        - githubBearer: []
      x-sdkgen-pagination:
        style: headerNextUrl
        responseItems: /items
