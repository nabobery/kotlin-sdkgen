openapi: 3.1.0
info:
  title: Pagination Fixture
  description: >
    A small, purpose-built GitHub-shaped spec proving pagination generation end to end through the real
    engine/emitter pipeline: `listIssues` sources its next page from the response's RFC 8288 Link header
    (x-sdkgen-pagination headerNextUrl), and `listWidgets` walks numeric offset/limit pages
    (x-sdkgen-pagination offsetLimit) with a declared responseTotal.
  version: "1"
servers:
  - url: https://api.pagination-fixture.test
paths:
  /repos/{owner}/{repo}/issues:
    get:
      operationId: listIssues
      summary: Lists issues for a repository, paginated via the Link response header.
      x-sdkgen-pagination:
        style: headerNextUrl
        responseItems: /items
      security:
        - apiKey: []
      parameters:
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: A page of issues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuePage"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /repos/widgets:
    get:
      operationId: listWidgets
      summary: Lists widgets, paginated via numeric offset/limit query parameters.
      x-sdkgen-pagination:
        style: offsetLimit
        requestOffset: offset
        requestLimit: limit
        responseItems: /data
        responseTotal: /total
      security:
        - apiKey: []
      parameters:
        - name: offset
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
        - name: kind
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of widgets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetPage"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
  schemas:
    Issue:
      type: object
      additionalProperties: false
      required:
        - id
        - title
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
    IssuePage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
    Widget:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    WidgetPage:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Widget"
        total:
          type: integer
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
