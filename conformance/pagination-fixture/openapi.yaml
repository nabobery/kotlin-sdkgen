openapi: 3.1.0
info:
  title: Pagination Fixture
  description: >
    A small, purpose-built GitHub-shaped spec proving RFC 8288 Link-header pagination generation (task T7):
    one operation whose next page is sourced from the response's Link header via x-sdkgen-pagination
    headerNextUrl metadata, generated end to end through the real engine/emitter pipeline.
  version: "1"
servers:
  - url: https://api.pagination-fixture.test
paths:
  /repos/{owner}/{repo}/issues:
    get:
      operationId: listIssues
      summary: Lists issues for a repository, paginated via the Link response header.
      x-sdkgen-pagination:
        style: headerNextUrl
        responseItems: /items
      security:
        - apiKey: []
      parameters:
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: A page of issues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuePage"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
  schemas:
    Issue:
      type: object
      additionalProperties: false
      required:
        - id
        - title
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
    IssuePage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
