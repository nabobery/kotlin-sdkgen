# Stress: inline oneOf mixing primitive, object, and reference branches without a discriminator.
# Expected: preserve every branch and enforce exactly one structural match with typed mismatch diagnostics.
openapi: 3.1.0
info:
  title: Mixed inline oneOf
  version: 1.0.0
paths:
  /value:
    post:
      operationId: submitValue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: string
                - type: object
                  required: [count]
                  properties:
                    count:
                      type: integer
                - $ref: '#/components/schemas/NamedValue'
      responses:
        '204':
          description: Accepted
components:
  schemas:
    NamedValue:
      type: object
      required: [name]
      properties:
        name:
          type: string
