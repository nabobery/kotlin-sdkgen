# Stress: binary success payload plus typed non-2xx error and response headers.
# Expected: keep binary bodies portable, preserve headers, and surface non-2xx responses as typed failures.
openapi: 3.1.0
info:
  title: Binary and non-2xx response
  version: 1.0.0
paths:
  /files/{id}:
    get:
      operationId: downloadFile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File bytes
          headers:
            ETag:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: File not found
          headers:
            X-Request-Id:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
