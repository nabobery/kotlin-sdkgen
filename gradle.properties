# Developer defaults. Both values below are deliberately generous for interactive work on a workstation
# and are NOT the contract CI runs under: every workflow step passes an explicit
# -Dorg.gradle.jvmargs and -Dorg.gradle.parallel=false on the command line, which is what binds the build
# JVM regardless of the daemon model. A per-step JAVA_TOOL_OPTIONS does reach the single-use daemon that
# --no-daemon forks, so it is not inert, but it is not dependable either: it has no effect on a reused
# daemon and it applies to every other JVM the build launches, including test workers and forked
# compilers, where the value may be wrong. See AGENTS.md "RESOURCE-SAFE CONFORMANCE" for per-task heaps.
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.warning.mode=all
org.gradle.parallel=true
kotlin.code.style=official
kotlin.js.yarn=false
sdkgenVersion=0.2.1-SNAPSHOT
