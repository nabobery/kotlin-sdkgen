name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, lint, and API checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JAVA_TOOL_OPTIONS: -Xmx2g
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@facf10a55b9caf92e0cc749b4f82bf8220989148 # v1.7.2

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify production modules
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          ./gradlew --no-daemon --max-workers=1 -Dorg.gradle.parallel=false \
            -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy=in-process \
            :generator:model:check \
            :generator:openapi:check \
            :generator:engine:check \
            :generator:cli:check \
            :runtime:core:check \
            :runtime:testing:check \
            :runtime:transport-ktor:check \
            :runtime:transport-okhttp:check \
            :runtime:transport-java-http:check \
            :integrations:gradle-plugin:check \
            ktlintCheck \
            apiCheck
