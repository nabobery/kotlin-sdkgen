---
# Release-candidate verification and local rehearsal — read-only and credential-free.
#
# This workflow runs as much of the verification gate docs/release-runbook.md ("Real release",
# step 3) and the rehearsal steps ("Rehearsal", steps 1-5) as EXISTING Gradle tasks currently
# support — cross-corpus parity, the standard build/check/ktlint/apiCheck gates, and
# publication-inventory/metadata verification against an isolated local repository. It does not
# implement any new verification logic itself. It never publishes anywhere:
#   - No signing key, Central Portal credential, or Gradle Plugin Portal credential is referenced
#     anywhere in this file.
#   - It never calls `publish` against any remote repository, `publishToMavenCentral`, or
#     `publishPlugins` — the only `publish` invocation targets the isolated local repository via
#     `publish-to-isolated-repository.init.gradle.kts` (publication rehearsal), which redirects `maven-publish`
#     away from any remote coordinate.
#   - `permissions: contents: read` at both workflow and job scope; no job in this file is ever
#     granted `contents: write`, `id-token: write`, or `packages: write`. There is nothing here to
#     poison, because no release credential is available to this workflow.
#
# Direct rehearsal uses workflow_dispatch. `release.yml` also invokes this file through
# workflow_call for the exact tagged commit before its protected publish job can start.

name: Release verification (manual rehearsal)

on:
  workflow_call:
    inputs:
      release_candidate_version:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      release_candidate_version:
        description: >-
          sdkgenVersion to rehearse (e.g. a non-SNAPSHOT release-candidate version). Left blank
          rehearses the current sdkgenVersion gradle property unchanged.
        type: string
        default: ""

concurrency:
  # Directly dispatched rehearsals share drift.yml's `sdkgen-heavy-gradle-lane` group — GitHub only
  # serializes runs whose group names match exactly. A call from release.yml is governed by the
  # caller's `release-<version>` group instead. Without serialization, a scheduled drift run and a
  # directly dispatched release rehearsal could run their Gradle/generation lanes at the same time,
  # which
  # AGENTS.md ("Resource-safe verification") explicitly
  # forbids ("Never run GitHub, Stripe, OpenRouter, publication rehearsal, or benchmark
  # measurement concurrently"). `cancel-in-progress: false` here (deliberately not `true`): a
  # release rehearsal must never be silently killed mid-run by an unrelated drift check starting —
  # an overlapping run queues behind whichever one is already in progress instead.
  group: sdkgen-heavy-gradle-lane
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Linux lane: JVM + JS(node+browser) + Android + Linux native targets, plus every task that
  # composes parity, compatibility reporting, publication rehearsal, and performance-budget
  # verification. ADR-0007's Apple targets cannot be produced here (see the `macos`
  # job below) — this job does not attempt them.
  verify-linux:
    name: Verify (JVM/JS/Android/Linux)
    runs-on: ubuntu-latest
    # Sequential by design (one Gradle lane at a time), and the work is corpus-scale: three
    # generated SDKs compiled across eight Kotlin targets, then parity, publication rehearsal and
    # staged-consumer verification. Observed wall time is well over an hour, so the previous 90
    # limit would have cut a healthy run short. This is a ceiling against a hung build, not a
    # performance budget — the performance budget is `verifyBenchmarkBudget` below.
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      # Incremental compilation is disabled for the whole job. A CI job checks out a clean tree, so
      # there is no previous build state for IC to be incremental against — every task compiles from
      # scratch regardless — but IC still builds and holds its lookup caches and classpath snapshots
      # in the compiler's heap. Over the ~7k generated files of a corpus consumer that overhead is
      # measured in gigabytes on a runner that only has 7.75 GiB (see the capacity step). Turning it
      # off buys heap without changing a single byte of compiler output.
      # `--max-workers=2` with parallel project execution uses the 4-vCPU/16 GiB runner this job now
      # requires (see the capacity precondition). The AGENTS.md "one Gradle lane at a time" rule is
      # about concurrent Gradle INVOCATIONS on a shared workstation — steps here are still strictly
      # sequential — and its `--max-workers=1` profile was carried to CI only to survive the old
      # 7.75 GiB runner. Run 30748616875 measured that profile on the 16 GiB class: memory steady at
      # 13.0/15.9 GiB with zero swap while three vCPUs sat idle through a 1h47m corpus compile.
      # Two workers keeps peak memory bounded (each forked test worker is capped by
      # JAVA_TOOL_OPTIONS below) while letting independent projects/targets overlap.
      # `kotlin.native.jvmArgs` is set explicitly because JAVA_TOOL_OPTIONS=-Xmx2g on these steps
      # would otherwise become the Kotlin/Native compiler JVM's cap — BELOW its own ~3g default.
      # Run 30756270863 measured that: `stripe:consumer:compileKotlinIosArm64` died in 30 seconds
      # with "Compilation failed: Java heap space" under the 2g cap, on a machine with 12 GiB free.
      GRADLE_ARGS: >-
        --no-daemon --max-workers=2 -Dorg.gradle.parallel=true
        -Pkotlin.compiler.execution.strategy=in-process
        -Pkotlin.native.jvmArgs=-Xmx4g
        -Pkotlin.incremental=false -Pkotlin.incremental.multiplatform=false
        -Pkotlin.incremental.js=false
      # The dispatcher-supplied input is placed into an environment variable by the runner (GitHub
      # expands `${{ }}` into the *value* of this mapping entry, not into any script's source
      # text), and every step below reads it back only as `"$RC_VERSION"` — a quoted shell
      # variable reference, never spliced into a script body. That is what actually prevents
      # command injection here; see the "Validate release_candidate_version" step for the
      # accompanying grammar check, and docs/release-runbook.md for the full audit of every
      # `${{ }}` interpolation in this file.
      RC_VERSION: ${{ inputs.release_candidate_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Fails closed on anything that is not empty or a plain <major>.<minor>.<patch>[-<pre>]
      # version string, before the value is used to build any `-PsdkgenVersion=...` argument
      # below. This is defense in depth on top of the env-variable passing pattern (a value that
      # can never reach a shell as unquoted script text has no injection surface regardless of its
      # grammar), not a substitute for it.
      - name: Validate release_candidate_version
        run: |
          set -eu
          # `grep -Eq` anchors per LINE, not per value, so a multiline input such as
          # "1.2.3\ninvalid!" would match on its first line and pass the whole value through as
          # the -PsdkgenVersion argument. Reject any embedded newline explicitly first, then apply
          # the grammar to what is now guaranteed to be a single line.
          if [ -n "$RC_VERSION" ]; then
            if [ "$(printf '%s' "$RC_VERSION" | wc -l | tr -d ' ')" != "0" ]; then
              echo "::error::release_candidate_version must be a single line; it contains a line break."
              exit 1
            fi
            if ! printf '%s' "$RC_VERSION" \
              | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
              echo "::error::release_candidate_version '${RC_VERSION}' is not a plain <major>.<minor>.<patch>[-<prerelease>] version string."
              exit 1
            fi
          fi

      # Runner capacity is the binding constraint on this job, and the numbers below are measured,
      # not assumed. Telemetry added here in run 30655436681 reported `MemTotal` of 7937 MiB and
      # 3 GiB of swap on `ubuntu-latest` — a 2-core/7 GiB standard runner, NOT the 16 GiB VM
      # several earlier revisions of this file were sized against. That single fact explains every
      # failure this workflow had: an 8 GiB build heap does not fit in 7.75 GiB of RAM at all, so
      # the VM went into terminal swap thrash and the runner agent itself was killed ("The runner
      # has received a shutdown signal", four consecutive runs); a 6 GiB heap fit, survived, and
      # then exhausted itself in `:conformance:github:consumer:compileKotlin` after 29 minutes of
      # GC. The step immediately after this one now refuses to proceed on a machine that small;
      # this step still runs first so that its telemetry covers the refusal itself.
      #
      # Disk, by contrast, is measured to be a non-issue: 28 GiB stayed available throughout that
      # same run. The reclaim below is therefore kept mainly to fund the swapfile.
      #
      # Three things happen here:
      #   1. Reclaim disk by deleting preinstalled toolchains this repository never uses.
      #      Deliberately NOT deleted: /usr/local/lib/android and /opt/hostedtoolcache/{Java,node},
      #      which the setup-android/setup-java/setup-node steps below populate and consume.
      #   2. Add 10 GiB of swap, placed on /mnt (the runner's separate scratch disk) so it does not
      #      compete with the root filesystem the build writes its outputs to. This is a safety
      #      net, not a performance plan: no Kotlin compile should be running out of swap, but the
      #      failure mode it prevents — the runner agent being killed, taking the whole job's
      #      diagnosis down with it — is far worse than a slow step.
      #   3. Start a background sampler so any future capacity failure attributes itself instead of
      #      costing another blind iteration. The final always() step of this job prints it.
      - name: Reclaim runner disk, add swap, and start capacity telemetry
        run: |
          set -eu
          echo "== baseline =="
          df -h / || true
          free -m || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/miniconda || true
          docker image prune -af >/dev/null 2>&1 || true
          sudo fallocate -l 10G /mnt/sdkgen-swapfile
          sudo chmod 600 /mnt/sdkgen-swapfile
          sudo mkswap /mnt/sdkgen-swapfile
          sudo swapon /mnt/sdkgen-swapfile
          echo "== after reclaim and swapon =="
          df -h / || true
          free -m || true
          # Sampled every 30s into a file the always() step tails. `nohup ... &` deliberately
          # outlives this step; GitHub's "Cleaning up orphan processes" reaps it at job end.
          nohup bash -c 'while true; do
            echo "== $(date -u +%H:%M:%S) =="
            free -m | sed -n "2p"
            df -h --output=avail / | tail -1
            ps -eo rss,comm --sort=-rss | head -4
            sleep 30
          done' > /tmp/sdkgen-runner-telemetry.log 2>&1 &
          echo "telemetry sampler started"

      # Fail fast, and say why, on a runner too small to finish this job — rather than discovering it
      # four hours later as a timeout, which is exactly what happened in run 30660519336.
      #
      # The evidence, from three instrumented runs on a 2-core/7.75 GiB standard runner:
      #   * 30655436681 — 6 GiB in-process heap: `OutOfMemoryError: Java heap space` in
      #     `:conformance:github:consumer:compileKotlin` after 29 minutes of GC, 7.1 GiB RSS.
      #   * 30658435937 — 6 GiB dedicated Kotlin compiler daemon: `GC overhead limit exceeded` in the
      #     same task, again at ~29 minutes.
      #   * 30660519336 — 7 GiB daemon, incremental compilation off, 10 GiB of swap: the same task ran
      #     for 3h53m without completing, the whole time pegged at ~7.7 of 7.9 GiB with 4.2 GiB of swap
      #     in use, and was killed by the job timeout. Swap does not fix this; it converts a fast
      #     failure into a slow one.
      #
      # The GitHub corpus consumer compiles ~7k generated Kotlin files as a single `compileKotlin`
      # task, and AGENTS.md already records that these corpora need up to 8 GiB for a clean compile.
      # A heap that large cannot fit in a 7.75 GiB machine alongside Gradle and the OS, so this job
      # needs a larger runner: change `runs-on` to a larger-runner label (GitHub larger runners are
      # configured at the organization/repository level) and update MIN_RUNNER_MEMORY_MIB with it.
      # There is no workflow-side setting that makes a corpus-scale compile fit in 7.75 GiB, and the
      # gate must not be narrowed to pretend otherwise.
      - name: Require a runner large enough for the corpus-scale compiles
        env:
          # 15 GiB is the 16 GiB larger-runner class. Below it, the compile above is known not to
          # complete; this is a measured floor, not a guess.
          MIN_RUNNER_MEMORY_MIB: "15000"
        run: |
          set -eu
          total_mib=$(free -m | awk '/^Mem:/ {print $2}')
          echo "runner memory: ${total_mib} MiB (minimum ${MIN_RUNNER_MEMORY_MIB} MiB)"
          if [ "$total_mib" -lt "$MIN_RUNNER_MEMORY_MIB" ]; then
            echo "::error::This runner has ${total_mib} MiB of RAM. Release verification compiles" \
              "corpus-scale generated SDKs that need ~8 GiB of Kotlin compiler heap, which does not" \
              "fit here: see this step's comment for the three measured runs. Provision a larger" \
              "runner (>= ${MIN_RUNNER_MEMORY_MIB} MiB), set runs-on to its label, and re-dispatch."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node (KMP node-download is disabled; Node must be on PATH)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Set up Chrome (Karma + ChromeHeadless JS browser tests)
        id: chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2

      - name: Set up Android SDK (ANDROID_HOME)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4.3.1

      # Every step below is sequential within this single job — not a parallel matrix — per
      # AGENTS.md "RESOURCE-SAFE CONFORMANCE" ("Run only one Gradle or corpus-generation lane at
      # a time") and the plan's explicit ban on overlapping GitHub/Stripe/OpenRouter/publication/
      # benchmark lanes. See docs/release-runbook.md for the full rationale.
      #
      # `version_arg` is built once as a bash array and reused by every gradlew invocation in this
      # job that needs it (this step, and every publication step below) so that a dispatched
      # release-candidate version is honored consistently everywhere, not just by whichever
      # invocation happened to receive it — `--no-daemon` means a property given to one Gradle
      # invocation never persists into the next.
      # The three corpus-scale consumer builds (GitHub ~7k generated files, Stripe larger) are the
      # only genuinely memory-hungry work in this job, so they run first, in isolation, and the
      # full-build step below then finds these tasks UP-TO-DATE.
      #
      # This is the one step that deviates from `GRADLE_ARGS`'s
      # `-Pkotlin.compiler.execution.strategy=in-process`, and the deviation is the point.
      # In-process is the right default on a developer workstation — AGENTS.md mandates it for
      # resource-safe local runs, where a second JVM is pure waste. On a 7.75 GiB runner it is
      # exactly backwards: it forces ONE heap to hold both Gradle's model of a 25-project
      # configuration-cached build AND the Kotlin compiler's view of 7k generated files. Run
      # 30655436681 measured what that costs — a 6g in-process heap spent 29 minutes in GC and then
      # threw `OutOfMemoryError: Java heap space` in `github:consumer:compileKotlin`.
      #
      # Splitting the compiler into its own daemon buys back the ~1.5 GiB of Gradle-side overhead
      # that heap was also carrying, and lets each side be sized honestly: a 900m Gradle JVM (it only
      # schedules tasks here) plus an 11g compiler daemon. The capacity precondition above is what
      # guarantees there is a machine underneath it — the three runs cited there are why this is
      # not simply tuned smaller.
      #
      # The daemon is killed at the end of the step so it cannot linger, holding 11 GiB, into the
      # in-process steps below.
      #
      # This step stays at ONE worker, unlike GRADLE_ARGS: run 30752841832 measured what two workers
      # do here — the Stripe metadata compile and the GitHub compile landed in the SAME shared
      # daemon heap, Stripe died of GC overhead at 20 minutes, and GitHub then threw
      # `OutOfMemoryError: Java heap space` even running essentially alone afterward. That last
      # point is also why the daemon is 11g, not the 8g AGENTS.md records for a local clean compile:
      # on this runner's JVM an 8g heap is marginal for `github:consumer:compileKotlin` by itself
      # (run 30748616875 sat at a full 8.6 GiB RSS for 1h47m without completing). 11g plus the 900m
      # Gradle JVM is sized for the 16 GiB class the capacity precondition guarantees.
      #
      # One corpus per Gradle invocation, with the compiler daemon killed between them, so heap the
      # daemon retains from one corpus (caches, arenas held at their high-water mark) cannot erode
      # the headroom of the next. The three config-cache reloads this costs are noise next to the
      # compiles themselves.
      - name: Corpus-consumer build (dedicated 11 GiB Kotlin compiler daemon, one corpus at a time)
        run: |
          set -eu
          version_arg=()
          [ -n "$RC_VERSION" ] && version_arg=(-PsdkgenVersion="$RC_VERSION")
          for consumer in github stripe openrouter; do
            ./gradlew --no-daemon --max-workers=1 -Dorg.gradle.parallel=false \
              -Pkotlin.compiler.execution.strategy=daemon \
              -Pkotlin.daemon.jvmargs=-Xmx11g \
              -Pkotlin.native.jvmArgs="-Xmx8g -Dfile.encoding=UTF-8" \
              -Pkotlin.incremental=false -Pkotlin.incremental.multiplatform=false \
              -Pkotlin.incremental.js=false \
              -Dorg.gradle.jvmargs="$GRADLE_JVM_ARGS" \
              ":conformance:${consumer}:consumer:build" "${version_arg[@]}"
            pkill -f KotlinCompileDaemon || true
          done
        env:
          # NOT the "it only schedules tasks" 900m this step used to run: three identical ~30s
          # "Compilation failed: Java heap space" failures on stripe:consumer:compileKotlinIosArm64
          # (runs 30756270863, 30757069344, 30757888081 — the last with 8g granted via BOTH
          # kotlin.native.jvmArgs and JAVA_TOOL_OPTIONS, dying 2 seconds in) prove by elimination
          # that the Kotlin/Native compiler runs in-process INSIDE this Gradle JVM, so its 900m cap
          # was the Native compile's heap. 8g is a cap, not an allocation — the Gradle JVM only
          # grows during the Native compiles, when the 11g Kotlin daemon is idle.
          GRADLE_JVM_ARGS: "-Xmx8g -Dfile.encoding=UTF-8"
          # Reaches every forked JVM: the compiler daemon (whose own explicit -Xmx wins over it),
          # the consumers' test workers, and the Kotlin/Native compiler. 8g, not the other steps'
          # 2g: runs 30756270863 (2g cap) and 30757069344 (2g cap + kotlin.native.jvmArgs=4g) both
          # killed the Stripe iOS cross-compile in ~30 seconds with "Compilation failed: Java heap
          # space", so K/N's heap is set high through BOTH mechanisms — whichever JVM actually runs
          # the Native compile, it gets 8g. Safe here because this step is single-worker serial:
          # at most one forked JVM runs alongside the (then-idle) compiler daemon, and the swapfile
          # absorbs transient overlap.
          JAVA_TOOL_OPTIONS: "-Xmx8g"
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}

      - name: Full build, check, ktlint, and BCV apiCheck
        run: |
          set -eu
          version_arg=()
          [ -n "$RC_VERSION" ] && version_arg=(-PsdkgenVersion="$RC_VERSION")
          ./gradlew $GRADLE_ARGS -Dorg.gradle.jvmargs="$GRADLE_JVM_ARGS" build check ktlintCheck apiCheck "${version_arg[@]}"
        env:
          # Binds the build JVM explicitly. JAVA_TOOL_OPTIONS below does reach the single-use daemon
          # that --no-daemon forks, but it is not a dependable control: it does not apply to a reused
          # daemon, and it silently applies to every other JVM the build launches (test workers,
          # forked compilers) where this value may be wrong. -Dorg.gradle.jvmargs is explicit and
          # independent of the daemon model.
          #
          # 3g, not 4g: on a 7.75 GiB runner (see the capacity step) a 4g in-process build heap plus
          # a forked Kotlin/Native compiler is already the whole machine. The corpus JVM compiles
          # that actually needed a large heap are UP-TO-DATE by the time this step runs.
          GRADLE_JVM_ARGS: "-Xmx3g -Dfile.encoding=UTF-8"
          JAVA_TOOL_OPTIONS: "-Xmx2g"
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}

      # cross-corpus parity gate — composed, not reimplemented. `parityGate` verifies the already-committed
      # parity evidence/registry (conformance/parity/evidence, registry/parity-rows.json) against the
      # corpus inputs at this exact commit; it `dependsOn(tasks.test)` so it re-runs this module's
      # own tests but reads recorded, not freshly re-measured, per-corpus evidence. That is not a
      # release gate: the committed ledger records `gateStatus: failed`, 0 passed rows and 24
      # `notRun`, by design — live producer evidence is deliberately never checked in — so
      # `parityGate` verifies that the tree still satisfies a record of work that was not run.
      #
      # `:conformance:parity:liveParity` is the real gate. It owns the whole sequence in one
      # invocation: clear run-scoped evidence, run each corpus consumer test, record outcomes,
      # produce evidence, enforce. An earlier revision of this file declined to compose the live
      # gate because its cross-project task wiring "was not fully verified by inspection alone" —
      # correctly, because at that time `liveParityGate` declared no task dependencies at all and
      # invoking it scheduled no producer. That is fixed; the graph is now verified by a dry run.
      - name: Live cross-corpus parity gate
        run: ./gradlew $GRADLE_ARGS -Dorg.gradle.jvmargs="$GRADLE_JVM_ARGS" :conformance:parity:liveParity
        env:
          # Binds the build JVM explicitly. JAVA_TOOL_OPTIONS below does reach the single-use daemon
          # that --no-daemon forks, but it is not a dependable control: it does not apply to a reused
          # daemon, and it silently applies to every other JVM the build launches (test workers,
          # forked compilers) where this value may be wrong. -Dorg.gradle.jvmargs is explicit and
          # independent of the daemon model.
          # 3g/2g, not 4g/4g: this step runs each corpus consumer's test suite, so a build JVM and a
          # test worker are alive at once on a 7.75 GiB runner (see the capacity step).
          GRADLE_JVM_ARGS: "-Xmx3g -Dfile.encoding=UTF-8"
          JAVA_TOOL_OPTIONS: "-Xmx2g"

      # `generateParityMatrices` writes into the *source tree*
      # (docs/conformance/evidence/parity-matrices.{md,json}), so running it in CI without checking the
      # result silently regenerates a committed artifact and discards the difference. The diff below
      # turns it into a drift check: if the committed matrices do not match what this tree produces,
      # the step fails instead of quietly rewriting them.
      - name: Cross-corpus parity matrices (verify committed matrices are current)
        run: |
          set -eu
          ./gradlew $GRADLE_ARGS -Dorg.gradle.jvmargs="$GRADLE_JVM_ARGS" :conformance:parity:generateParityMatrices
          git diff --exit-code -- docs/conformance/evidence/parity-matrices.md \
            docs/conformance/evidence/parity-matrices.json
        env:
          # Binds the build JVM explicitly. JAVA_TOOL_OPTIONS below does reach the single-use daemon
          # that --no-daemon forks, but it is not a dependable control: it does not apply to a reused
          # daemon, and it silently applies to every other JVM the build launches (test workers,
          # forked compilers) where this value may be wrong. -Dorg.gradle.jvmargs is explicit and
          # independent of the daemon model.
          GRADLE_JVM_ARGS: "-Xmx2g -Dfile.encoding=UTF-8"
          JAVA_TOOL_OPTIONS: "-Xmx2g"

      # benchmark budget verification: `:generator:engine:verifyBenchmarkBudget` now exists and
      # verifies the three committed records in `generator/engine/benchmarks/records/` against
      # `generator/engine/benchmarks/budget.json` (median of three, fail-closed on any mismatch —
      # see BenchmarkBudgetVerifier). It does NOT run a fresh benchmark: `githubScaleBenchmark` and
      # `recordGitHubScaleBenchmarkMeasurement` are deliberately not invoked here, because a fresh
      # measurement becomes committed evidence only via a human deliberately promoting it (see
      # the benchmark budget records). Composing the live measurement into CI is
      # left for a future packet once records exist for the designated CI runner (the committed
      # records today are host-local to a developer Mac; the verifier's environment-matching guard
      # means CI-runner records must be captured on that runner and committed separately before this
      # step can be anything more than "does the tree still satisfy the current host-local budget").
      - name: benchmark budget verification (against committed records)
        run: ./gradlew $GRADLE_ARGS -Dorg.gradle.jvmargs="$GRADLE_JVM_ARGS" :generator:engine:verifyBenchmarkBudget
        env:
          # Binds the build JVM explicitly. JAVA_TOOL_OPTIONS below does reach the single-use daemon
          # that --no-daemon forks, but it is not a dependable control: it does not apply to a reused
          # daemon, and it silently applies to every other JVM the build launches (test workers,
          # forked compilers) where this value may be wrong. -Dorg.gradle.jvmargs is explicit and
          # independent of the daemon model.
          GRADLE_JVM_ARGS: "-Xmx2g -Dfile.encoding=UTF-8"
          JAVA_TOOL_OPTIONS: "-Xmx2g"

      # publication rehearsal — isolated local file repository only, never a real remote
      # repository. `sdkgen.publishing.gradle.kts` declares no repository at all ("Remote
      # repositories and credentials are intentionally deferred until release automation exists");
      # the ONLY repository `publish` can target here is the "isolated" one this init script adds
      # (build-logic has no other repository declaration anywhere). `-PpublicationRepository` is
      # passed explicitly so this step and the two verification tasks below agree on the same
      # directory rather than relying on their independently-defined defaults happening to match.
      # `-PsdkgenVersion` is passed explicitly here too (not just to the "Full build" step above):
      # `--no-daemon` means each `./gradlew` invocation is a fresh process, so a property given to
      # one invocation does not persist into the next. Without repeating it, a dispatched
      # release-candidate version would compile correctly above but this step would still publish
      # and verify the default `sdkgenVersion` (0.1.0-SNAPSHOT) — rehearsing a different version
      # than the one asked for while reporting success.
      - name: Publish to isolated local repository (rehearsal only, never remote)
        run: |
          set -eu
          version_arg=()
          [ -n "$RC_VERSION" ] && version_arg=(-PsdkgenVersion="$RC_VERSION")
          # Cross-compiled Apple klib publication is disabled for the rehearsal: Kotlin 2.2.20+
          # cross-compiles Apple klibs from Linux by default, which staged nine
          # iosarm64/iossimulatorarm64/macosarm64 coordinates run 30765386366's inventory gate
          # correctly rejected — ADR-0007/0008 assign Apple artifacts to the macOS lane, and the
          # Linux lane stages exactly the eight-coordinate set. (Those cross-published variants
          # also escaped the ADR-0008 artifactId rename — raw `core-iosarm64` instead of
          # `kotlin-sdkgen-runtime-iosarm64` — so single-host publication would need that rename
          # ordering fixed first if an ADR revision ever adopts it.)
          ./gradlew $GRADLE_ARGS -Dorg.gradle.jvmargs="$GRADLE_JVM_ARGS" -PpublicationRepository=build/publication-repository \
            -Pkotlin.native.enableKlibsCrossCompilation=false \
            "${version_arg[@]}" \
            --init-script conformance/publication/publish-to-isolated-repository.init.gradle.kts \
            publish
        env:
          # Binds the build JVM explicitly. JAVA_TOOL_OPTIONS below does reach the single-use daemon
          # that --no-daemon forks, but it is not a dependable control: it does not apply to a reused
          # daemon, and it silently applies to every other JVM the build launches (test workers,
          # forked compilers) where this value may be wrong. -Dorg.gradle.jvmargs is explicit and
          # independent of the daemon model.
          GRADLE_JVM_ARGS: "-Xmx2g -Dfile.encoding=UTF-8"
          JAVA_TOOL_OPTIONS: "-Xmx2g"

      - name: Verify publication metadata
        run: |
          set -eu
          version_arg=()
          [ -n "$RC_VERSION" ] && version_arg=(-PsdkgenVersion="$RC_VERSION")
          ./gradlew $GRADLE_ARGS -Dorg.gradle.jvmargs="$GRADLE_JVM_ARGS" -PpublicationRepository=build/publication-repository \
            "${version_arg[@]}" \
            :conformance:publication:verifyPublicationMetadata
        env:
          # Binds the build JVM explicitly. JAVA_TOOL_OPTIONS below does reach the single-use daemon
          # that --no-daemon forks, but it is not a dependable control: it does not apply to a reused
          # daemon, and it silently applies to every other JVM the build launches (test workers,
          # forked compilers) where this value may be wrong. -Dorg.gradle.jvmargs is explicit and
          # independent of the daemon model.
          GRADLE_JVM_ARGS: "-Xmx2g -Dfile.encoding=UTF-8"
          JAVA_TOOL_OPTIONS: "-Xmx2g"

      - name: Generate and verify staged artifact inventory
        run: |
          set -eu
          version_arg=()
          [ -n "$RC_VERSION" ] && version_arg=(-PsdkgenVersion="$RC_VERSION")
          ./gradlew $GRADLE_ARGS -Dorg.gradle.jvmargs="$GRADLE_JVM_ARGS" -PpublicationRepository=build/publication-repository \
            "${version_arg[@]}" \
            :conformance:publication:generateStagedArtifactInventory \
            :conformance:publication:verifyStagedArtifactInventory
        env:
          # Binds the build JVM explicitly. JAVA_TOOL_OPTIONS below does reach the single-use daemon
          # that --no-daemon forks, but it is not a dependable control: it does not apply to a reused
          # daemon, and it silently applies to every other JVM the build launches (test workers,
          # forked compilers) where this value may be wrong. -Dorg.gradle.jvmargs is explicit and
          # independent of the daemon model.
          GRADLE_JVM_ARGS: "-Xmx2g -Dfile.encoding=UTF-8"
          JAVA_TOOL_OPTIONS: "-Xmx2g"

      - name: Compile isolated consumers against staged artifacts
        run: |
          set -eu
          version_arg=()
          [ -n "$RC_VERSION" ] && version_arg=(-PsdkgenVersion="$RC_VERSION")
          ./gradlew $GRADLE_ARGS -Dorg.gradle.jvmargs="$GRADLE_JVM_ARGS" -PpublicationRepository=build/publication-repository \
            "${version_arg[@]}" \
            :conformance:publication:executeIsolatedConsumerBuild
        env:
          GRADLE_JVM_ARGS: "-Xmx2g -Dfile.encoding=UTF-8"
          JAVA_TOOL_OPTIONS: "-Xmx2g"

      # Diagnostic only — `if: always()` so it also reports when a step above failed, which is the
      # case that matters. It never fails the job (`|| true` throughout): a capacity report must
      # not be able to turn a green verification red, and must not mask a real failure either.
      # `dmesg` is the authoritative answer for a VM-level OOM kill; the sampler tail shows the
      # approach to whichever limit was hit.
      - name: Runner capacity report
        if: always()
        run: |
          echo "== final =="
          df -h / || true
          free -m || true
          echo "== kernel OOM evidence (empty means no kill was logged) =="
          sudo dmesg 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' | tail -20 || true
          echo "== capacity samples (last 60) =="
          tail -60 /tmp/sdkgen-runner-telemetry.log || true

      # docs/release-runbook.md, "Rehearsal" step 5 calls for `validatePlugins` and
      # `publishPlugins --validate-only`. Both tasks come from the `com.gradle.plugin-publish`
      # Gradle plugin, which `integrations/gradle-plugin/build.gradle.kts` does not apply (it
      # only applies `java-gradle-plugin` + `sdkgen.publishing`) — those tasks do not exist in
      # this tree today. Adding `com.gradle.plugin-publish` is a real new build dependency and a
      # Gradle Plugin Portal identity/credential decision the runbook flags as deferred; not added
      # here. Left out; see docs/release-runbook.md.

      # five-layer compatibility report is NOT enforced here, and the reason matters.
      #
      # An earlier revision of this comment said there is "no `sdkgen compat`". That is false:
      # CompatCommand is registered in sdkgenCommand() (generator/cli/.../CliModule.kt) with
      # --from/--to/--format/--fail-on and four evidence flags, and is covered by CompatCommandTest
      # and CompatCommandEvidenceWiringTest. Only the second half of that comment held — there is
      # genuinely no `verifyCompatibility`-style Gradle task to compose.
      #
      # The emitted `kotlinApi` projection is now signature-aware and bound to the corresponding
      # manifest's declaration-model and generated-file digests. The remaining gap is orchestration:
      # the workflow has no checked-in before/after manifest, behavior, ABI, and projection evidence
      # pair to pass to `sdkgen compat`. Do not describe compatibility as CI-enforced until that
      # evidence lifecycle and task exist.

  # macOS lane: ADR-0007 — Apple targets (iosArm64, iosSimulatorArm64, macosArm64) cannot be
  # produced on any other host. Sequenced after verify-linux (needs:) rather than run in parallel,
  # matching the resource-safe-verification requirement to not overlap heavy build lanes; on
  # separate runners this is a belt-and-suspenders sequencing choice, not a shared-memory
  # necessity, but it keeps this workflow's behavior consistent with the plan's stated intent and
  # keeps failures easy to attribute to one lane at a time.
  verify-macos:
    name: Verify (Apple targets, ADR-0007)
    needs: verify-linux
    runs-on: macos-14
    # Kotlin/Native compiles the corpus-scale consumers for three Apple targets here; same
    # reasoning as verify-linux's ceiling above.
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      # Same pattern and same reasoning as `verify-linux`: the input is read only via the `env:`
      # mechanism, never spliced into a `run:` script body. This job is a separate runner/process
      # from `verify-linux`, so it re-validates independently below rather than trusting that
      # `verify-linux`'s validation ran — `needs: verify-linux` only guarantees that job succeeded
      # before this one starts, it does not share state with it.
      RC_VERSION: ${{ inputs.release_candidate_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate release_candidate_version
        run: |
          set -eu
          # `grep -Eq` anchors per LINE, not per value, so a multiline input such as
          # "1.2.3\ninvalid!" would match on its first line and pass the whole value through as
          # the -PsdkgenVersion argument. Reject any embedded newline explicitly first, then apply
          # the grammar to what is now guaranteed to be a single line.
          if [ -n "$RC_VERSION" ]; then
            if [ "$(printf '%s' "$RC_VERSION" | wc -l | tr -d ' ')" != "0" ]; then
              echo "::error::release_candidate_version must be a single line; it contains a line break."
              exit 1
            fi
            if ! printf '%s' "$RC_VERSION" \
              | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
              echo "::error::release_candidate_version '${RC_VERSION}' is not a plain <major>.<minor>.<patch>[-<prerelease>] version string."
              exit 1
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node (KMP node-download is disabled; Node must be on PATH)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4.3.1

      - name: Build and check Apple targets
        run: |
          set -eu
          version_arg=()
          [ -n "$RC_VERSION" ] && version_arg=(-PsdkgenVersion="$RC_VERSION")
          # ${arr[@]+"${arr[@]}"} instead of the plain expansion the Linux job uses: macOS runners
          # execute /bin/bash 3.2, where `set -u` treats an EMPTY array's "${arr[@]}" as an unbound
          # variable (run 30768536471 died on exactly that). Bash 4.4+ on the Linux runners does not.
          # iosArm64 is a DEVICE target: KMP creates no `iosArm64Test` run task for it (run
          # 30771666198 failed on Gradle's ambiguous-abbreviation match), because nothing on CI can
          # execute a device binary. `iosArm64TestBinaries` links the test executable — compiling
          # main + test code and driving the full native toolchain — which is the strongest
          # verification a device target admits. The simulator and macOS targets run their tests.
          #
          # Scoped to the three KMP PRODUCT modules, not the bare task names: unqualified
          # `iosSimulatorArm64Test` aggregates over every project including the corpus consumers,
          # and a corpus-scale Kotlin/Native compile needs ~8 GiB of heap this runner class does
          # not have (run 30775084346: "Compilation failed: Java heap space" — the same
          # measurement the verify-linux corpus step is sized around). The consumers' Apple klibs
          # are already compiled and verified by that Linux corpus step via Kotlin 2.2.20+
          # cross-compilation; what only a macOS host can add — and what ADR-0007 asks of this
          # lane — is native-host verification of the published product modules: real simulator
          # and macOS test execution plus device-target linking. Corpus-consumer test EXECUTION on
          # a simulator remains unexercised on CI; that needs a larger Mac runner class.
          ./gradlew --no-daemon --max-workers=1 -Dorg.gradle.parallel=false \
            -Dorg.gradle.jvmargs="$GRADLE_JVM_ARGS" \
            -Pkotlin.compiler.execution.strategy=in-process \
            :runtime:core:iosArm64TestBinaries :runtime:core:iosSimulatorArm64Test :runtime:core:macosArm64Test \
            :runtime:testing:iosArm64TestBinaries :runtime:testing:iosSimulatorArm64Test :runtime:testing:macosArm64Test \
            :runtime:transport-ktor:iosArm64TestBinaries :runtime:transport-ktor:iosSimulatorArm64Test :runtime:transport-ktor:macosArm64Test \
            apiCheck ${version_arg[@]+"${version_arg[@]}"}
        env:
          # Binds the build JVM explicitly. JAVA_TOOL_OPTIONS below does reach the single-use daemon
          # that --no-daemon forks, but it is not a dependable control: it does not apply to a reused
          # daemon, and it silently applies to every other JVM the build launches (test workers,
          # forked compilers) where this value may be wrong. -Dorg.gradle.jvmargs is explicit and
          # independent of the daemon model.
          # macos-14 is also a small standard runner, so the same reasoning as verify-linux applies:
          # 3g for the build JVM and a 2g floor for what it forks, rather than 4g/4g. The
          # Kotlin/Native compiles that dominate this lane run in their own process.
          GRADLE_JVM_ARGS: "-Xmx3g -Dfile.encoding=UTF-8"
          JAVA_TOOL_OPTIONS: "-Xmx2g"

      # Same purpose as verify-linux's capacity report: if this lane dies of capacity, it should say
      # so in its own run rather than in the next blind iteration. Diagnostic only, never fails.
      - name: Runner capacity report
        if: always()
        run: |
          echo "== memory =="
          sysctl -n hw.memsize || true
          vm_stat || true
          echo "== disk =="
          df -h / || true
