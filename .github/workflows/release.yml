name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Non-SNAPSHOT semantic version matching the selected v<version> tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate-release-ref:
    name: Validate immutable release ref
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the matching tag on main
        shell: bash
        run: |
          set -euo pipefail
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          semver+='(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver+='(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?'
          semver+='(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ ! "$RELEASE_VERSION" =~ $semver ]] || [[ "$RELEASE_VERSION" == *-SNAPSHOT ]]; then
            echo "::error::version must be a non-SNAPSHOT semantic version"
            exit 1
          fi
          expected_ref="refs/tags/v$RELEASE_VERSION"
          if [ "$GITHUB_REF" != "$expected_ref" ]; then
            echo "::error::dispatch this workflow from $expected_ref, not $GITHUB_REF"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$expected_ref does not point to a commit on origin/main"
            exit 1
          fi

  verify:
    name: Verify tagged release candidate
    needs: validate-release-ref
    uses: ./.github/workflows/release-verification.yml
    with:
      release_candidate_version: ${{ inputs.version }}

  publish:
    name: Sign, attest, and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      JAVA_TOOL_OPTIONS: -Xmx8g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Build signed release repository and SBOM
        shell: bash
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=1 -Dorg.gradle.parallel=false \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PsdkgenVersion="$RELEASE_VERSION" -PsdkgenRelease=true \
            --init-script conformance/publication/publish-to-isolated-repository.init.gradle.kts \
            publish cyclonedxBom
          ./gradlew --no-daemon --max-workers=1 -Dorg.gradle.parallel=false \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PsdkgenVersion="$RELEASE_VERSION" -PsdkgenVerifyReleaseArtifacts=true \
            :conformance:publication:verifyPublicationMetadata \
            :conformance:publication:verifyStagedArtifactInventory \
            :conformance:publication:executeIsolatedConsumerBuild

      - name: Validate Gradle Plugin Portal metadata
        run: ./gradlew --no-daemon -PsdkgenVersion="$RELEASE_VERSION" :integrations:gradle-plugin:validatePlugins

      - name: Assemble deterministic release bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-bundle
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf - \
            build/publication-repository \
            build/reports/cyclonedx/bom.json \
            build/reports/cyclonedx/bom.xml \
            conformance/publication/build/reports/publication \
            | gzip -n > "build/release-bundle/kotlin-sdkgen-$RELEASE_VERSION-release-bundle.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlin-sdkgen-${{ env.RELEASE_VERSION }}-release-bundle
          if-no-files-found: error
          retention-days: 30
          path: build/release-bundle/kotlin-sdkgen-${{ env.RELEASE_VERSION }}-release-bundle.tar.gz

      - name: Attest release bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/release-bundle/kotlin-sdkgen-${{ env.RELEASE_VERSION }}-release-bundle.tar.gz

      - name: Publish to Central Portal and wait for availability
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
        run: |
          ./gradlew --no-daemon --max-workers=1 -Dorg.gradle.parallel=false \
            -PsdkgenVersion="$RELEASE_VERSION" -PsdkgenRelease=true \
            -PsdkgenCentralPublishingType=AUTOMATIC \
            publishAggregationToCentralPortal

      - name: Publish Gradle plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew --no-daemon -PsdkgenVersion="$RELEASE_VERSION" :integrations:gradle-plugin:publishPlugins
